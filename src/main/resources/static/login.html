<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Medicline Pharma</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-wrapper {
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
        }
        .auth-wrapper .bg-glow {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--surface-container);
            border: 1px solid var(--outline-variant);
            border-radius: var(--rounded-lg);
            padding: 40px;
            position: relative;
            z-index: 1;
        }
        .auth-card h2 {
            text-align: center;
            margin-bottom: 8px;
        }
        .auth-card > p {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-tabs {
            display: flex;
            background: var(--surface-container-low);
            border-radius: var(--rounded-full);
            padding: 4px;
            margin-bottom: 32px;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px 16px;
            border-radius: var(--rounded-full);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--on-surface-variant);
            transition: all var(--transition-fast);
            border: none;
            background: none;
        }
        .auth-tab.active {
            background: var(--primary);
            color: var(--on-primary);
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: var(--outline);
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--outline-variant);
        }
        .error-msg {
            display: none;
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: var(--rounded);
            color: var(--error);
            font-size: 13px;
            margin-bottom: 16px;
        }
        .success-msg {
            display: none;
            padding: 12px 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: var(--rounded);
            color: var(--success);
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="brand">Medicline Pharma</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="doctors.html">Doctors</a>
            <a href="pharmacy.html">Pharmacy</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="bg-glow"></div>
        <div class="auth-card animate-fade-in">
            <h2>Welcome back</h2>
            <p>Sign in to access your clinical dashboard</p>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
                <button class="auth-tab" onclick="switchTab('register')">Register</button>
            </div>

            <div id="error-msg" class="error-msg"></div>
            <div id="success-msg" class="success-msg"></div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="return handleLogin(event)">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" placeholder="you@example.com" required>
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
                <button type="submit" class="btn btn-primary w-full">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" style="display:none;" onsubmit="return handleRegister(event)">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" placeholder="John Doe" required>
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" placeholder="you@example.com" required>
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" placeholder="••••••••" required>
                <label for="reg-role">I am a</label>
                <select id="reg-role">
                    <option value="PATIENT">Patient</option>
                    <option value="DOCTOR">Doctor</option>
                </select>
                <button type="submit" class="btn btn-primary w-full">Create Account</button>
            </form>

            <div class="divider">or</div>
            <p style="text-align:center;font-size:13px;">
                <a href="index.html" style="color:var(--primary);text-decoration:none;">← Back to Home</a>
            </p>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('error-msg').style.display = 'none';
            document.getElementById('success-msg').style.display = 'none';
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('register-form').style.display = 'none';
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'block';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (res.ok) {
                    const user = await res.json();
                    localStorage.setItem('user', JSON.stringify(user));
                    if (user.role === 'DOCTOR') {
                        window.location.href = 'doctor-dashboard.html';
                    } else if (user.role === 'ADMIN') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    document.getElementById('error-msg').textContent = 'Invalid email or password.';
                    document.getElementById('error-msg').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('error-msg').textContent = 'Server error. Please try again.';
                document.getElementById('error-msg').style.display = 'block';
            }
            return false;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });
                if (res.ok) {
                    const user = await res.json();
                    localStorage.setItem('user', JSON.stringify(user));
                    document.getElementById('success-msg').textContent = 'Account created! Redirecting...';
                    document.getElementById('success-msg').style.display = 'block';
                    setTimeout(() => {
                        if (user.role === 'DOCTOR') {
                            window.location.href = 'doctor-dashboard.html';
                        } else if (user.role === 'ADMIN') {
                            window.location.href = 'admin-dashboard.html';
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    }, 1000);
                } else {
                    document.getElementById('error-msg').textContent = 'Registration failed. Email may already exist.';
                    document.getElementById('error-msg').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('error-msg').textContent = 'Server error. Please try again.';
                document.getElementById('error-msg').style.display = 'block';
            }
            return false;
        }
    </script>
</body>
</html>
